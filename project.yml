# XcodeGen spec. If the bundled GuessAge.xcodeproj ever gets out of sync,
# install XcodeGen (`brew install xcodegen`) and run `xcodegen generate` to
# regenerate it from this single source of truth.
name: GuessAge
options:
  bundleIdPrefix: com.thvibe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  GuessAge:
    type: application
    platform: iOS
    sources:
      - path: GuessAge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thvibe.guessage
        INFOPLIST_FILE: GuessAge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  GuessAgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GuessAgeTests
    dependencies:
      - target: GuessAge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thvibe.guessage.tests
        GENERATE_INFOPLIST_FILE: YES
