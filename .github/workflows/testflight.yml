name: TestFlight

# Manual button (Actions tab -> TestFlight -> Run workflow) or push a v* tag.
# It never runs on ordinary pushes, so normal CI is unaffected, and it stays
# inert until the App Store Connect secrets below are added to the repo.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  beta:
    name: Build & upload to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write App Store Connect API key to a file
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Build and upload
        run: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
