name: Pages

# Publishes the web version (web/) to GitHub Pages.
# One-time: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# GitHub Pages deploys ONLY from the repo's default branch (the `github-pages`
# environment rejects any other branch), so this workflow triggers only on the
# default branch. If you promote a different branch to default (Settings ->
# Branches), update the branch below to match so Pages keeps deploying.
on:
  push:
    branches: [claude/age-guessing-game-ios-4rs8x2]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
