name: Generate faces

# Pre-generates a set of anime face images on GitHub's runner (which can reach
# the internet), commits them to web/faces/, and Pages redeploys to serve them.
# Run it from the Actions tab: "Generate faces" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many anime faces to generate"
        default: "60"

permissions:
  contents: write

concurrency:
  group: generate-faces
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate anime faces
        run: python tools/fetch_pollinations.py --count ${{ github.event.inputs.count }}

      - name: Commit the generated set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/faces
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            n=$(ls web/faces/*.jpg 2>/dev/null | wc -l | tr -d ' ')
            git commit -m "Generate anime face set (${n} images)"
            git push
          fi
