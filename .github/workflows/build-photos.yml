name: Build photo set

# Collects real, royalty-free photos with VERIFIED ages from Wikimedia and
# commits them for the web app to play. HYBRID output:
#   * web/photos/p-*.jpg + manifest.json  — the offline CORE (downloaded,
#     face-cropped 640² squares) that ships in the repo.
#   * web/photos/stream.json              — thousands of STREAM entries that
#     reference Commons thumbnail URLs only (no image files committed). Runs
#     append to this file, so the streamed pool grows toward thousands.
# Run from the Actions tab, or push a change to the builder / this workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "How many verified records to gather this run (core + stream)"
        default: "2500"
      candidates:
        description: "How many Wikidata people to scan for dated photos"
        default: "80000"
  push:
    branches: [claude/age-guessing-game-ios-4rs8x2]
    paths:
      - "tools/build_dataset.py"
      - ".github/workflows/build-photos.yml"

permissions:
  contents: write

concurrency:
  group: build-photos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenCV (for face-crop)
        # Pin to 4.x — cv2 5.0 dropped the top-level CascadeClassifier the crop uses.
        run: pip install --quiet "opencv-python-headless==4.10.0.84"

      - name: Collect verified-age photos (hybrid core + stream)
        run: |
          # Rebuild the offline core fresh, but KEEP any accumulated stream.json
          # so streamed entries accrue across runs (--append-stream).
          mkdir -p web/photos
          rm -f web/photos/p-*.jpg web/photos/manifest.json
          python tools/build_dataset.py \
            --web-dir web/photos \
            --target ${{ github.event.inputs.target || '2500' }} \
            --core-count 200 \
            --stream-out web/photos/stream.json --append-stream \
            --candidates ${{ github.event.inputs.candidates || '80000' }} \
            --thumb-width 640 \
            --face-crop \
            --budget 2700

      - name: Commit the photo set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/photos
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            core=$(ls web/photos/*.jpg 2>/dev/null | wc -l | tr -d ' ')
            stream=$(python -c "import json;print(len(json.load(open('web/photos/stream.json'))['photos']))" 2>/dev/null || echo 0)
            git commit -m "Build photo set (core ${core}, stream ${stream})"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
